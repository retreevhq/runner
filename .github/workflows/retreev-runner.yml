---
name: Retreev Runner

on:
  repository_dispatch:
    types:
      - "trigger-heavy-build"

env:
  REGISTRY: ghcr.io

concurrency:
  group: retreev-${{ github.event.client_payload.env_short }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Generate Runtime Cross-Repo Token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.RETREEV_CLIENT_ID }}
          private-key: ${{ secrets.RETREEV_APP_PRIVATE_KEY }}
          owner: retreevhq
          repositories: "retreev"
          permission-actions: "read"
          permission-packages: "write"

      - name: Download backend source artifact
        run: |
          GH_TOKEN=${{ steps.app-token.outputs.token }} gh api \
            "repos/${{ github.event.client_payload.source_repo }}/actions/artifacts/${{ github.event.client_payload.artifact_id }}/zip" \
            > /tmp/artifact.zip

      - name: Extract source code
        run: |
          mkdir -p backend
          unzip -p /tmp/artifact.zip backend-src.tar.gz > /tmp/backend-src.tar.gz
          tar -xzf /tmp/backend-src.tar.gz -C backend
          rm -f /tmp/artifact.zip /tmp/backend-src.tar.gz

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        id: buildx
        with:
          buildkitd-config-inline: |
            [worker.oci]
              compression-type = "zstd"
              compression-level = 3

      - name: Logout of GitHub Container Registry
        run: docker logout ghcr.io || true

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.RETREEV_CR_PAT }}

      - name: Cache UV downloads
        uses: actions/cache@v4
        id: cache-uv
        with:
          path: backend/cache-mount
          key: uv-${{ runner.os }}-${{ hashFiles('backend/uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Restore UV cache mounts
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-dir: backend/cache-mount
          cache-map: |
            {
              "uv-cache": "/root/.cache/uv"
            }

      - name: Build test image (with dev deps)
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: dev
          tags: retreev-test:${{ github.event.client_payload.short_sha }}
          load: true
          cache-from: |
            type=gha,scope=test
            type=gha,scope=core
          cache-to: type=gha,scope=test,mode=max

      - name: Run tests
        run: |
          docker run --rm \
            --entrypoint "" \
            retreev-test:${{ github.event.client_payload.short_sha }} \
            sh -c "cd /src && uv run pytest tests/ -v"
        # timeout-minutes: 10

      - name: Clean up Docker
        if: always()
        run: docker image prune -f || true

  build_core:
    if: ${{ github.event.client_payload.component != 'inference' }}
    runs-on: ubuntu-24.04
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Generate Runtime Cross-Repo Token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.RETREEV_CLIENT_ID }}
          private-key: ${{ secrets.RETREEV_APP_PRIVATE_KEY }}
          owner: retreevhq
          repositories: "retreev"
          permission-actions: "read"
          permission-packages: "write"

      - name: Download backend source artifact
        run: |
          GH_TOKEN=${{ steps.app-token.outputs.token }} gh api \
            "repos/${{ github.event.client_payload.source_repo }}/actions/artifacts/${{ github.event.client_payload.artifact_id }}/zip" \
            > /tmp/artifact.zip

      - name: Extract source code
        run: |
          mkdir -p backend
          unzip -p /tmp/artifact.zip backend-src.tar.gz > /tmp/backend-src.tar.gz
          tar -xzf /tmp/backend-src.tar.gz -C backend
          rm -f /tmp/artifact.zip /tmp/backend-src.tar.gz

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        id: buildx
        with:
          buildkitd-config-inline: |
            [worker.oci]
              compression-type = "zstd"
              compression-level = 3

      - name: Logout of GitHub Container Registry
        run: docker logout ghcr.io || true

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.RETREEV_CR_PAT }}

      - name: Cache UV downloads
        uses: actions/cache@v4
        id: cache-uv
        with:
          path: backend/cache-mount
          key: uv-${{ runner.os }}-${{ hashFiles('backend/uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Restore UV cache mounts
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-dir: backend/cache-mount
          cache-map: |
            {
              "uv-cache": "/root/.cache/uv"
            }

      - name: Build and push core image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: cpu-base
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ github.event.client_payload.repo_name }}:${{ github.event.client_payload.env_short }}-${{ github.event.client_payload.short_sha }}
            ghcr.io/${{ github.repository_owner }}/${{ github.event.client_payload.repo_name }}:${{ github.event.client_payload.env_short }}-${{ github.event.client_payload.version }}
            ghcr.io/${{ github.repository_owner }}/${{ github.event.client_payload.repo_name }}:${{ github.event.client_payload.env_tag }}
          cache-from: type=gha,scope=core
          cache-to: type=gha,scope=core,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.event.client_payload.source_repo }}
            org.opencontainers.image.revision=${{ github.event.client_payload.short_sha }}
            org.opencontainers.image.created=${{ github.run_id }}

      - name: Clean up Docker
        if: always()
        run: docker image prune -f || true

  build_inference:
    if: ${{ github.event.client_payload.component != 'core' }}
    runs-on: ubuntu-24.04
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Generate Runtime Cross-Repo Token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.RETREEV_CLIENT_ID }}
          private-key: ${{ secrets.RETREEV_APP_PRIVATE_KEY }}
          owner: retreevhq
          repositories: "retreev"
          permission-actions: "read"
          permission-packages: "write"

      - name: Download backend source artifact
        run: |
          GH_TOKEN=${{ steps.app-token.outputs.token }} gh api \
            "repos/${{ github.event.client_payload.source_repo }}/actions/artifacts/${{ github.event.client_payload.artifact_id }}/zip" \
            > /tmp/artifact.zip

      - name: Extract source code
        run: |
          mkdir -p backend
          unzip -p /tmp/artifact.zip backend-src.tar.gz > /tmp/backend-src.tar.gz
          tar -xzf /tmp/backend-src.tar.gz -C backend
          rm -f /tmp/artifact.zip /tmp/backend-src.tar.gz

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        id: buildx
        with:
          buildkitd-config-inline: |
            [worker.oci]
              compression-type = "zstd"
              compression-level = 3

      - name: Logout of GitHub Container Registry
        run: docker logout ghcr.io || true

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.RETREEV_CR_PAT }}

      - name: Cache UV downloads
        uses: actions/cache@v4
        id: cache-uv
        with:
          path: backend/cache-mount
          key: uv-${{ runner.os }}-${{ hashFiles('backend/uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Restore UV cache mounts
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-dir: backend/cache-mount
          cache-map: |
            {
              "uv-cache": "/root/.cache/uv"
            }

      - name: Build and push inference image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: inference
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ github.event.client_payload.repo_name }}-inference:${{ github.event.client_payload.env_short }}-${{ github.event.client_payload.short_sha }}
            ghcr.io/${{ github.repository_owner }}/${{ github.event.client_payload.repo_name }}-inference:${{ github.event.client_payload.env_short }}-${{ github.event.client_payload.version }}
            ghcr.io/${{ github.repository_owner }}/${{ github.event.client_payload.repo_name }}-inference:${{ github.event.client_payload.env_tag }}
          cache-from: |
            type=gha,scope=inference
            type=gha,scope=core
          cache-to: type=gha,scope=inference,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.event.client_payload.source_repo }}
            org.opencontainers.image.revision=${{ github.event.client_payload.short_sha }}
            org.opencontainers.image.created=${{ github.run_id }}

      - name: Clean up Docker
        if: always()
        run: docker image prune -f || true

  deploy_full:
    if: ${{ github.event.client_payload.component == 'full' }}
    runs-on: ubuntu-24.04
    needs: [test, build_core, build_inference]
    # needs: [build_core]
    environment: ${{ github.event.client_payload.env_name }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Generate Runtime Cross-Repo Token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.RETREEV_CLIENT_ID }}
          private-key: ${{ secrets.RETREEV_APP_PRIVATE_KEY }}
          owner: retreevhq
          repositories: "retreev"
          permission-actions: "read"

      - name: Download backend source artifact
        run: |
          GH_TOKEN=${{ steps.app-token.outputs.token }} gh api \
            "repos/${{ github.event.client_payload.source_repo }}/actions/artifacts/${{ github.event.client_payload.artifact_id }}/zip" \
            > /tmp/artifact.zip

      - name: Extract source code
        run: |
          mkdir -p backend
          unzip -p /tmp/artifact.zip backend-src.tar.gz > /tmp/backend-src.tar.gz
          tar -xzf /tmp/backend-src.tar.gz -C backend
          rm -f /tmp/artifact.zip /tmp/backend-src.tar.gz

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.RETREEV_CR_PAT }}

      - name: Create deployment metadata
        run: |
          cat > deployment-info.json << EOF
          {
            "deployed_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "short_sha": "${{ github.event.client_payload.short_sha }}",
            "version": "${{ github.event.client_payload.version }}",
            "environment": "${{ github.event.client_payload.env_name }}"
          }
          EOF
          cat deployment-info.json

      - name: Create env file
        run: |
          echo "CORE_TAG=${{ github.event.client_payload.env_short }}-${{ github.event.client_payload.version }}" > ./envfile
          echo "INFERENCE_TAG=${{ github.event.client_payload.env_short }}-${{ github.event.client_payload.version }}" >> ./envfile
          echo "APP_VERSION=${{ github.event.client_payload.version }}" >> ./envfile
          echo "GIT_COMMIT_SHA=${{ github.event.client_payload.short_sha }}" >> ./envfile
          echo "INFERENCE_VERSION=${{ github.event.client_payload.version }}" >> ./envfile
          echo "INFERENCE_GIT_COMMIT_SHA=${{ github.event.client_payload.short_sha }}" >> ./envfile

      - name: Deploy
        uses: cssnr/stack-deploy-action@v1.5.0
        with:
          name: retreev_${{ github.event.client_payload.env_short }}
          file: backend/infra/stack.base.yml backend/infra/stack.${{ github.event.client_payload.env_short }}.yml
          host: ${{ secrets.RETREEV_DEPLOY_HOST }}
          port: 22
          user: deploy
          ssh_key: ${{ secrets.RETREEV_DEPLOY_SSH_KEY }}
          registry_auth: true
          registry_host: ghcr.io
          registry_user: ${{ github.repository_owner }}
          registry_pass: ${{ secrets.RETREEV_CR_PAT }}
          resolve_image: changed
          prune: true
          mode: swarm
          env_file: ./envfile
          summary: true

  verify_core_full:
    if: ${{ github.event.client_payload.component == 'full' }}
    runs-on: ubuntu-24.04
    needs: [deploy_full]
    environment: ${{ github.event.client_payload.env_name }}

    steps:
      - name: Confirm API version and commit SHA are live
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: "${{ secrets.RETREEV_DEPLOY_HOST }}"
          port: 22
          username: deploy
          key: ${{ secrets.RETREEV_DEPLOY_SSH_KEY }}
          script: |
            EXPECTED_VERSION="${{ github.event.client_payload.version }}"
            EXPECTED_SHA="${{ github.event.client_payload.short_sha }}"
            EXPECTED_PROTOCOL="${{ github.event.client_payload.inference_protocol_version }}"

            echo "Waiting for services to be healthy..."
            for i in {1..30}; do
              REPLICAS=$(docker service ls --filter name=retreev_${{ github.event.client_payload.env_short }} --format "{{.Replicas}}")
              if [ -n "$REPLICAS" ] && ! echo "$REPLICAS" | grep -q "0/"; then
                RESPONSE=$(curl -s "${{ secrets.RETREEV_BASE_API_URL }}/healthcheck")
                echo "API healthcheck: $RESPONSE"

                LIVE_VERSION=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['servers']['api']['version'])" 2>/dev/null || true)
                LIVE_SHA=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['servers']['api']['commit_sha'])" 2>/dev/null || true)
                LIVE_PROTOCOL=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['servers']['inference']['protocol_version'])" 2>/dev/null || true)

                if [ "$LIVE_VERSION" = "$EXPECTED_VERSION" ] && [ "$LIVE_SHA" = "$EXPECTED_SHA" ] && [ "$LIVE_PROTOCOL" = "$EXPECTED_PROTOCOL" ]; then
                  echo "✅ API verified: version=$LIVE_VERSION commit_sha=$LIVE_SHA inference_protocol=$LIVE_PROTOCOL"
                  exit 0
                else
                  echo "❌ Core or inference protocol mismatch (got version=$LIVE_VERSION sha=$LIVE_SHA protocol=$LIVE_PROTOCOL, expected version=$EXPECTED_VERSION sha=$EXPECTED_SHA protocol=$EXPECTED_PROTOCOL)"
                  exit 1
                fi
              fi
              echo "Attempt $i/30: Services not ready yet, retrying in 5s..."
              sleep 5
            done
            echo "Timed out waiting for healthy services."
            exit 1
        timeout-minutes: 6

  verify_inference_full:
    if: ${{ github.event.client_payload.component == 'full' }}
    runs-on: ubuntu-24.04
    needs: [deploy_full]
    environment: ${{ github.event.client_payload.env_name }}

    steps:
      - name: Confirm inference version and commit SHA are live
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: "${{ secrets.RETREEV_DEPLOY_HOST }}"
          port: 22
          username: deploy
          key: ${{ secrets.RETREEV_DEPLOY_SSH_KEY }}
          script: |
            EXPECTED_VERSION="${{ github.event.client_payload.version }}"
            EXPECTED_SHA="${{ github.event.client_payload.short_sha }}"
            EXPECTED_PROTOCOL="${{ github.event.client_payload.inference_protocol_version }}"

            echo "Waiting for inference service to be healthy..."
            for i in {1..30}; do
              REPLICAS=$(docker service ls --filter name=retreev_${{ github.event.client_payload.env_short }} --format "{{.Replicas}}")
              if [ -n "$REPLICAS" ] && ! echo "$REPLICAS" | grep -q "0/"; then
                RESPONSE=$(curl -s "${{ secrets.RETREEV_INFERENCE_API_URL }}/healthcheck")
                echo "Inference healthcheck: $RESPONSE"

                LIVE_VERSION=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['version'])" 2>/dev/null || true)
                LIVE_SHA=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['commit_sha'])" 2>/dev/null || true)
                LIVE_PROTOCOL=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['protocol_version'])" 2>/dev/null || true)

                if [ "$LIVE_VERSION" = "$EXPECTED_VERSION" ] && [ "$LIVE_SHA" = "$EXPECTED_SHA" ] && [ "$LIVE_PROTOCOL" = "$EXPECTED_PROTOCOL" ]; then
                  echo "✅ Inference verified: version=$LIVE_VERSION commit_sha=$LIVE_SHA protocol=$LIVE_PROTOCOL"
                  exit 0
                else
                  echo "❌ Version or protocol mismatch (got version=$LIVE_VERSION sha=$LIVE_SHA protocol=$LIVE_PROTOCOL, expected version=$EXPECTED_VERSION sha=$EXPECTED_SHA protocol=$EXPECTED_PROTOCOL)"
                  exit 1
                fi
              fi
              echo "Attempt $i/30: Services not ready yet, retrying in 5s..."
              sleep 5
            done
            echo "Timed out waiting for healthy inference services."
            exit 1
        timeout-minutes: 6

  deploy_inference:
    if: ${{ github.event.client_payload.component == 'inference' }}
    runs-on: ubuntu-24.04
    needs: [test, build_inference]
    environment: ${{ github.event.client_payload.env_name }}

    steps:
      - name: Update, verify, and roll back inference if needed
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: "${{ secrets.RETREEV_DEPLOY_HOST }}"
          port: 22
          username: deploy
          key: ${{ secrets.RETREEV_DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail

            STACK="retreev_${{ github.event.client_payload.env_short }}"
            SERVICE="${STACK}_inference"
            IMAGE="ghcr.io/${{ github.repository_owner }}/${{ github.event.client_payload.repo_name }}-inference@${{ needs.build_inference.outputs.image_digest }}"
            EXPECTED_VERSION="${{ github.event.client_payload.version }}"
            EXPECTED_SHA="${{ github.event.client_payload.short_sha }}"
            EXPECTED_PROTOCOL="${{ github.event.client_payload.inference_protocol_version }}"
            HEALTHCHECK_URL="${{ secrets.RETREEV_INFERENCE_API_URL }}/healthcheck"
            CORE_HEALTHCHECK_URL="${{ secrets.RETREEV_BASE_API_URL }}/healthcheck"

            service_env() {
              docker service inspect --format '{{range .Spec.TaskTemplate.ContainerSpec.Env}}{{println .}}{{end}}' "$1"
            }

            env_value() {
              service_env "$1" | awk -F= -v key="$2" '$1 == key {sub(/^[^=]*=/, ""); print; exit}'
            }

            core_snapshot() {
              docker service ls \
                --filter "label=com.docker.stack.namespace=${STACK}" \
                --format '{{.Name}}' \
                | sort \
                | while read -r candidate; do
                    [ "$candidate" = "$SERVICE" ] && continue
                    image=$(docker service inspect --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}' "$candidate")
                    version=$(env_value "$candidate" APP_VERSION)
                    sha=$(env_value "$candidate" GIT_COMMIT_SHA)
                    printf '%s|%s|%s|%s\n' "$candidate" "$image" "$version" "$sha"
                  done
            }

            core_accepts_protocol() {
              response=$(curl --fail --silent --show-error "$CORE_HEALTHCHECK_URL" 2>/dev/null || true)
              core_status=$(printf '%s' "$response" | python3 -c "import json,sys; print(json.load(sys.stdin)['servers']['inference'].get('status', ''))" 2>/dev/null || true)
              core_protocol=$(printf '%s' "$response" | python3 -c "import json,sys; print(json.load(sys.stdin)['servers']['inference'].get('protocol_version', ''))" 2>/dev/null || true)
              [ "$core_status" = "ok" ] && [ "$core_protocol" = "$EXPECTED_PROTOCOL" ]
            }

            rollback_and_fail() {
              reason="$1"
              echo "Inference deployment verification failed: ${reason}. Rolling back ${SERVICE}." >&2
              docker service update \
                --with-registry-auth \
                --image "$PREVIOUS_IMAGE" \
                --env-rm APP_VERSION \
                --env-add "APP_VERSION=${PREVIOUS_VERSION}" \
                --env-rm GIT_COMMIT_SHA \
                --env-add "GIT_COMMIT_SHA=${PREVIOUS_SHA}" \
                "$SERVICE"

              for rollback_attempt in {1..30}; do
                response=$(curl --fail --silent --show-error "$HEALTHCHECK_URL" 2>/dev/null || true)
                live_version=$(printf '%s' "$response" | python3 -c "import json,sys; print(json.load(sys.stdin).get('version', ''))" 2>/dev/null || true)
                live_sha=$(printf '%s' "$response" | python3 -c "import json,sys; print(json.load(sys.stdin).get('commit_sha', ''))" 2>/dev/null || true)
                live_protocol=$(printf '%s' "$response" | python3 -c "import json,sys; print(json.load(sys.stdin).get('protocol_version', ''))" 2>/dev/null || true)

                if [ "$live_version" = "$PREVIOUS_VERSION" ] && [ "$live_sha" = "$PREVIOUS_SHA" ] && [ "$live_protocol" = "$PREVIOUS_PROTOCOL" ]; then
                  echo "Rollback verified: version=${live_version} commit_sha=${live_sha}." >&2
                  exit 1
                fi

                echo "Rollback attempt ${rollback_attempt}/30: waiting for ${SERVICE}." >&2
                sleep 5
              done

              echo "Rollback was requested but the prior inference version did not become healthy." >&2
              exit 1
            }

            PREVIOUS_IMAGE=$(docker service inspect --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}' "$SERVICE")
            PREVIOUS_VERSION=$(env_value "$SERVICE" APP_VERSION)
            PREVIOUS_SHA=$(env_value "$SERVICE" GIT_COMMIT_SHA)
            previous_response=$(curl --fail --silent --show-error "$HEALTHCHECK_URL" 2>/dev/null || true)
            PREVIOUS_PROTOCOL=$(printf '%s' "$previous_response" | python3 -c "import json,sys; print(json.load(sys.stdin).get('protocol_version', ''))" 2>/dev/null || true)
            [ -n "$PREVIOUS_VERSION" ] || { echo "Could not read prior inference APP_VERSION." >&2; exit 1; }
            [ -n "$PREVIOUS_SHA" ] || { echo "Could not read prior inference GIT_COMMIT_SHA." >&2; exit 1; }
            [ -n "$PREVIOUS_PROTOCOL" ] || { echo "Could not read prior inference protocol version." >&2; exit 1; }
            CORE_BEFORE=$(core_snapshot)

            echo "Updating ${SERVICE} from ${PREVIOUS_IMAGE} to ${IMAGE}."
            echo "${{ secrets.RETREEV_CR_PAT }}" | docker login ghcr.io \
              --username "${{ github.repository_owner }}" \
              --password-stdin
            docker service update \
              --with-registry-auth \
              --image "$IMAGE" \
              --env-rm APP_VERSION \
              --env-add "APP_VERSION=${EXPECTED_VERSION}" \
              --env-rm GIT_COMMIT_SHA \
              --env-add "GIT_COMMIT_SHA=${EXPECTED_SHA}" \
              "$SERVICE"

            for attempt in {1..30}; do
              response=$(curl --fail --silent --show-error "$HEALTHCHECK_URL" 2>/dev/null || true)
              live_version=$(printf '%s' "$response" | python3 -c "import json,sys; print(json.load(sys.stdin).get('version', ''))" 2>/dev/null || true)
              live_sha=$(printf '%s' "$response" | python3 -c "import json,sys; print(json.load(sys.stdin).get('commit_sha', ''))" 2>/dev/null || true)
              live_protocol=$(printf '%s' "$response" | python3 -c "import json,sys; print(json.load(sys.stdin).get('protocol_version', ''))" 2>/dev/null || true)

              if [ "$live_version" = "$EXPECTED_VERSION" ] && [ "$live_sha" = "$EXPECTED_SHA" ] && [ "$live_protocol" = "$EXPECTED_PROTOCOL" ]; then
                CORE_AFTER=$(core_snapshot)
                if [ "$CORE_BEFORE" != "$CORE_AFTER" ]; then
                  rollback_and_fail "a non-inference service image or deployment metadata changed"
                fi
                if ! core_accepts_protocol; then
                  rollback_and_fail "the deployed core does not accept inference protocol ${EXPECTED_PROTOCOL}"
                fi
                echo "Inference verified: version=${live_version} commit_sha=${live_sha} protocol=${live_protocol}"
                exit 0
              fi

              echo "Attempt ${attempt}/30: expected version=${EXPECTED_VERSION} sha=${EXPECTED_SHA}; waiting for inference."
              sleep 5
            done

            rollback_and_fail "healthcheck did not report the requested version and commit SHA"
        timeout-minutes: 6

  deploy_core:
    if: ${{ github.event.client_payload.component == 'core' }}
    runs-on: ubuntu-24.04
    needs: [test, build_core]
    environment: ${{ github.event.client_payload.env_name }}

    steps:
      - name: Migrate, update, verify, and roll back core if needed
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: "${{ secrets.RETREEV_DEPLOY_HOST }}"
          port: 22
          username: deploy
          key: ${{ secrets.RETREEV_DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail

            STACK="retreev_${{ github.event.client_payload.env_short }}"
            MIGRATION_SERVICE="${STACK}_db_migrate"
            CORE_SERVICES=(
              "${STACK}_api"
              "${STACK}_worker"
              "${STACK}_worker_matching"
              "${STACK}_scheduler"
            )
            INFERENCE_SERVICE="${STACK}_inference"
            IMAGE="ghcr.io/${{ github.repository_owner }}/${{ github.event.client_payload.repo_name }}@${{ needs.build_core.outputs.image_digest }}"
            EXPECTED_VERSION="${{ github.event.client_payload.version }}"
            EXPECTED_SHA="${{ github.event.client_payload.short_sha }}"
            EXPECTED_PROTOCOL="${{ github.event.client_payload.inference_protocol_version }}"
            CORE_HEALTHCHECK_URL="${{ secrets.RETREEV_BASE_API_URL }}/healthcheck"
            INFERENCE_HEALTHCHECK_URL="${{ secrets.RETREEV_INFERENCE_API_URL }}/healthcheck"

            service_env() {
              docker service inspect --format '{{range .Spec.TaskTemplate.ContainerSpec.Env}}{{println .}}{{end}}' "$1"
            }

            env_value() {
              service_env "$1" | awk -F= -v key="$2" '$1 == key {sub(/^[^=]*=/, ""); print; exit}'
            }

            service_snapshot() {
              service="$1"
              image=$(docker service inspect --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}' "$service")
              version=$(env_value "$service" APP_VERSION)
              sha=$(env_value "$service" GIT_COMMIT_SHA)
              printf '%s|%s|%s|%s\n' "$service" "$image" "$version" "$sha"
            }

            core_snapshot() {
              for service in "${CORE_SERVICES[@]}"; do
                service_snapshot "$service"
              done
            }

            inference_snapshot() {
              service_snapshot "$INFERENCE_SERVICE"
            }

            inference_has_expected_protocol() {
              response=$(curl --fail --silent --show-error "$INFERENCE_HEALTHCHECK_URL" 2>/dev/null || true)
              protocol=$(printf '%s' "$response" | python3 -c "import json,sys; print(json.load(sys.stdin).get('protocol_version', ''))" 2>/dev/null || true)
              [ "$protocol" = "$EXPECTED_PROTOCOL" ]
            }

            core_is_live() {
              response=$(curl --fail --silent --show-error "$CORE_HEALTHCHECK_URL" 2>/dev/null || true)
              live_version=$(printf '%s' "$response" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['servers']['api'].get('version', ''))" 2>/dev/null || true)
              live_sha=$(printf '%s' "$response" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['servers']['api'].get('commit_sha', ''))" 2>/dev/null || true)
              live_inference_status=$(printf '%s' "$response" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['servers']['inference'].get('status', ''))" 2>/dev/null || true)
              live_protocol=$(printf '%s' "$response" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['servers']['inference'].get('protocol_version', ''))" 2>/dev/null || true)
              [ "$live_version" = "$EXPECTED_VERSION" ] \
                && [ "$live_sha" = "$EXPECTED_SHA" ] \
                && [ "$live_inference_status" = "ok" ] \
                && [ "$live_protocol" = "$EXPECTED_PROTOCOL" ]
            }

            core_desired_state_matches() {
              for service in "${CORE_SERVICES[@]}"; do
                [ "$(docker service inspect --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}' "$service")" = "$IMAGE" ] || return 1
                [ "$(env_value "$service" APP_VERSION)" = "$EXPECTED_VERSION" ] || return 1
                [ "$(env_value "$service" GIT_COMMIT_SHA)" = "$EXPECTED_SHA" ] || return 1
              done
            }

            rollback_and_fail() {
              reason="$1"
              echo "Core deployment verification failed: ${reason}. Rolling back core services." >&2
              while IFS='|' read -r service previous_image previous_version previous_sha; do
                [ -n "$service" ] || continue
                docker service update \
                  --with-registry-auth \
                  --image "$previous_image" \
                  --env-rm APP_VERSION \
                  --env-add "APP_VERSION=${previous_version}" \
                  --env-rm GIT_COMMIT_SHA \
                  --env-add "GIT_COMMIT_SHA=${previous_sha}" \
                  "$service"
              done <<< "$CORE_BEFORE"

              for rollback_attempt in {1..30}; do
                response=$(curl --fail --silent --show-error "$CORE_HEALTHCHECK_URL" 2>/dev/null || true)
                live_version=$(printf '%s' "$response" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['servers']['api'].get('version', ''))" 2>/dev/null || true)
                live_sha=$(printf '%s' "$response" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['servers']['api'].get('commit_sha', ''))" 2>/dev/null || true)
                if [ "$live_version" = "$PREVIOUS_API_VERSION" ] && [ "$live_sha" = "$PREVIOUS_API_SHA" ] && [ "$(inference_snapshot)" = "$INFERENCE_BEFORE" ]; then
                  echo "Core rollback verified: version=${live_version} commit_sha=${live_sha}." >&2
                  exit 1
                fi
                echo "Rollback attempt ${rollback_attempt}/30: waiting for core services." >&2
                sleep 5
              done

              echo "Rollback was requested but the prior core version did not become healthy." >&2
              exit 1
            }

            wait_for_migration() {
              for attempt in {1..60}; do
                migration_task=""
                while read -r candidate; do
                  if ! printf '%s\n' "$MIGRATION_TASKS_BEFORE" | grep -Fxq "$candidate"; then
                    migration_task="$candidate"
                    break
                  fi
                done < <(docker service ps -q "$MIGRATION_SERVICE")

                if [ -n "$migration_task" ]; then
                  state=$(docker inspect --format '{{.Status.State}}' "$migration_task")
                  error=$(docker inspect --format '{{.Status.Err}}' "$migration_task")
                  case "$state" in
                    complete)
                      echo "Migration job completed."
                      return 0
                      ;;
                    failed|rejected|shutdown)
                      echo "Migration job ${state}: ${error}" >&2
                      return 1
                      ;;
                  esac
                fi

                echo "Migration attempt ${attempt}/60: waiting for a successful job task."
                sleep 5
              done
              echo "Timed out waiting for ${MIGRATION_SERVICE}." >&2
              return 1
            }

            INFERENCE_BEFORE=$(inference_snapshot)
            CORE_BEFORE=$(core_snapshot)
            PREVIOUS_API_VERSION=$(env_value "${STACK}_api" APP_VERSION)
            PREVIOUS_API_SHA=$(env_value "${STACK}_api" GIT_COMMIT_SHA)
            [ -n "$PREVIOUS_API_VERSION" ] || { echo "Could not read prior API APP_VERSION." >&2; exit 1; }
            [ -n "$PREVIOUS_API_SHA" ] || { echo "Could not read prior API GIT_COMMIT_SHA." >&2; exit 1; }
            if ! inference_has_expected_protocol; then
              echo "Refusing core deployment: inference does not speak protocol ${EXPECTED_PROTOCOL}." >&2
              exit 1
            fi

            echo "${{ secrets.RETREEV_CR_PAT }}" | docker login ghcr.io \
              --username "${{ github.repository_owner }}" \
              --password-stdin

            MIGRATION_TASKS_BEFORE=$(docker service ps -q "$MIGRATION_SERVICE" || true)
            echo "Starting migration job with ${IMAGE}."
            docker service update \
              --with-registry-auth \
              --force \
              --image "$IMAGE" \
              --env-rm APP_VERSION \
              --env-add "APP_VERSION=${EXPECTED_VERSION}" \
              --env-rm GIT_COMMIT_SHA \
              --env-add "GIT_COMMIT_SHA=${EXPECTED_SHA}" \
              "$MIGRATION_SERVICE"
            wait_for_migration || { echo "Core services were not updated because migrations failed." >&2; exit 1; }

            for service in "${CORE_SERVICES[@]}"; do
              echo "Updating ${service} to ${IMAGE}."
              docker service update \
                --with-registry-auth \
                --image "$IMAGE" \
                --env-rm APP_VERSION \
                --env-add "APP_VERSION=${EXPECTED_VERSION}" \
                --env-rm GIT_COMMIT_SHA \
                --env-add "GIT_COMMIT_SHA=${EXPECTED_SHA}" \
                "$service" || rollback_and_fail "failed to submit the ${service} update"
            done

            for attempt in {1..30}; do
              if core_desired_state_matches \
                && core_is_live \
                && [ "$(inference_snapshot)" = "$INFERENCE_BEFORE" ]; then
                echo "Core verified: version=${EXPECTED_VERSION} commit_sha=${EXPECTED_SHA} protocol=${EXPECTED_PROTOCOL}."
                exit 0
              fi
              echo "Attempt ${attempt}/30: waiting for core rollout and compatibility verification."
              sleep 5
            done

            rollback_and_fail "core health, inference compatibility, or inference immutability verification failed"
        timeout-minutes: 9

  release_backend:
    runs-on: ubuntu-24.04
    needs: [verify_core_full, verify_inference_full]
    if: github.event.client_payload.component == 'full' && github.event.client_payload.env_name == 'production' && needs.verify_core_full.result == 'success' && needs.verify_inference_full.result == 'success'
    permissions:
      contents: write

    steps:
      - name: Generate Runtime Cross-Repo Token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.RETREEV_CLIENT_ID }}
          private-key: ${{ secrets.RETREEV_APP_PRIVATE_KEY }}
          owner: retreevhq
          repositories: "retreev"
          permission-contents: "write"

      - name: Checkout source code from retreev
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.client_payload.source_repo }}
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Create Release
        run: |
          TAG="backend/${{ github.event.client_payload.version }}"
          if git tag -l --format="%(contents)" "$TAG" | grep -q .; then
            # Annotated tag — use the tag message (written by OpenCode)
            gh release create "$TAG" \
              --title "Backend ${{ github.event.client_payload.version }}" \
              --notes-from-tag \
              --verify-tag \
              --latest
          else
            # Lightweight tag — auto-generate from commit history
            gh release create "$TAG" \
              --title "Backend ${{ github.event.client_payload.version }}" \
              --generate-notes \
              --verify-tag \
              --latest
          fi
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

  release_core:
    runs-on: ubuntu-24.04
    needs: [deploy_core]
    if: github.event.client_payload.component == 'core' && github.event.client_payload.env_name == 'production' && needs.deploy_core.result == 'success'
    permissions:
      contents: write

    steps:
      - name: Generate Runtime Cross-Repo Token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.RETREEV_CLIENT_ID }}
          private-key: ${{ secrets.RETREEV_APP_PRIVATE_KEY }}
          owner: retreevhq
          repositories: "retreev"
          permission-contents: "write"

      - name: Checkout source code from Retreev
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.client_payload.source_repo }}
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Create core release
        run: |
          TAG="core/${{ github.event.client_payload.version }}"
          if git tag -l --format="%(contents)" "$TAG" | grep -q .; then
            gh release create "$TAG" \
              --title "Core ${{ github.event.client_payload.version }}" \
              --notes-from-tag \
              --verify-tag
          else
            gh release create "$TAG" \
              --title "Core ${{ github.event.client_payload.version }}" \
              --generate-notes \
              --verify-tag
          fi
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

  release_inference:
    runs-on: ubuntu-24.04
    needs: [deploy_inference]
    if: github.event.client_payload.component == 'inference' && github.event.client_payload.env_name == 'production' && needs.deploy_inference.result == 'success'
    permissions:
      contents: write

    steps:
      - name: Generate Runtime Cross-Repo Token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.RETREEV_CLIENT_ID }}
          private-key: ${{ secrets.RETREEV_APP_PRIVATE_KEY }}
          owner: retreevhq
          repositories: "retreev"
          permission-contents: "write"

      - name: Checkout source code from Retreev
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.client_payload.source_repo }}
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Create inference release
        run: |
          TAG="inference/${{ github.event.client_payload.version }}"
          if git tag -l --format="%(contents)" "$TAG" | grep -q .; then
            gh release create "$TAG" \
              --title "Inference ${{ github.event.client_payload.version }}" \
              --notes-from-tag \
              --verify-tag
          else
            gh release create "$TAG" \
              --title "Inference ${{ github.event.client_payload.version }}" \
              --generate-notes \
              --verify-tag
          fi
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

  notify:
    runs-on: ubuntu-24.04
    needs: [verify_core_full, verify_inference_full, deploy_core, deploy_inference]
    if: always()
    environment: ${{ github.event.client_payload.env_name }}

    steps:
      - name: Determine deployment status
        id: status
        run: |
          COMPONENT="${{ github.event.client_payload.component }}"
          if { [ "$COMPONENT" = "full" ] && [ "${{ needs.verify_core_full.result }}" = "success" ] && [ "${{ needs.verify_inference_full.result }}" = "success" ]; } \
            || { [ "$COMPONENT" = "core" ] && [ "${{ needs.deploy_core.result }}" = "success" ]; } \
            || { [ "$COMPONENT" = "inference" ] && [ "${{ needs.deploy_inference.result }}" = "success" ]; }; then
            echo "STATUS=✅ SUCCESS" >> "$GITHUB_OUTPUT"
            echo "COLOR=good" >> "$GITHUB_OUTPUT"
          else
            echo "STATUS=❌ FAILED" >> "$GITHUB_OUTPUT"
            echo "COLOR=danger" >> "$GITHUB_OUTPUT"
          fi

      - name: Send Slack notification
        run: |
          curl -X POST ${{ secrets.RETREEV_SLACK_WEBHOOK_URL }} \
            -H 'Content-Type: application/json' \
            -d '{
              "text": "Retreev ${{ github.event.client_payload.env_name }} Deployment ${{ steps.status.outputs.STATUS }}",
              "attachments": [{
                "color": "${{ steps.status.outputs.COLOR }}",
                "fields": [
                  {"title": "Version", "value": "${{ github.event.client_payload.version }}", "short": true},
                  {"title": "Commit", "value": "${{ github.event.client_payload.short_sha }}", "short": true}
                ]
              }]
            }'
        continue-on-error: true
