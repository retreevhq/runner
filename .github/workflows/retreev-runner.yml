---
name: Retreev Runner

on:
  repository_dispatch:
    types:
      - "trigger-heavy-build"

env:
  REGISTRY: ghcr.io

concurrency:
  group: retreev-${{ github.event.client_payload.env_short }}-core
  cancel-in-progress: false

jobs:
  test:
    if: ${{ github.event.client_payload.component == 'core' || github.event.client_payload.component == 'full' }}
    runs-on: ubuntu-24.04

    steps:
      - name: Validate dispatch payload
        env:
          COMPONENT: ${{ github.event.client_payload.component }}
          MODEL_BUNDLE_REF: ${{ github.event.client_payload.model_bundle_ref }}
        run: |
          set -euo pipefail
          case "$COMPONENT" in
            core|full) ;;
            *) echo "retreev-runner only accepts core or full deployments." >&2; exit 1 ;;
          esac
          if [ "$COMPONENT" = "full" ] \
            && ! printf '%s' "$MODEL_BUNDLE_REF" \
              | grep -Eq '^[^[:space:]]+@sha256:[0-9a-f]{64}$'; then
            echo "Full deployments require a model_bundle_ref pinned by sha256 digest." >&2
            exit 1
          fi

      - name: Generate Runtime Cross-Repo Token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.RETREEV_CLIENT_ID }}
          private-key: ${{ secrets.RETREEV_APP_PRIVATE_KEY }}
          owner: retreevhq
          repositories: "retreev"
          permission-actions: "read"
          permission-packages: "write"

      - name: Download backend source artifact
        run: |
          GH_TOKEN=${{ steps.app-token.outputs.token }} gh api \
            "repos/${{ github.event.client_payload.source_repo }}/actions/artifacts/${{ github.event.client_payload.artifact_id }}/zip" \
            > /tmp/artifact.zip

      - name: Extract source code
        run: |
          mkdir -p backend
          unzip -p /tmp/artifact.zip backend-src.tar.gz > /tmp/backend-src.tar.gz
          tar -xzf /tmp/backend-src.tar.gz -C backend
          rm -f /tmp/artifact.zip /tmp/backend-src.tar.gz

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        id: buildx
        with:
          buildkitd-config-inline: |
            [worker.oci]
              compression-type = "zstd"
              compression-level = 3

      - name: Logout of GitHub Container Registry
        run: docker logout ghcr.io || true

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.RETREEV_CR_PAT }}

      - name: Cache UV downloads
        uses: actions/cache@v4
        id: cache-uv
        with:
          path: backend/cache-mount
          key: uv-${{ runner.os }}-${{ hashFiles('backend/uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Restore UV cache mounts
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-dir: backend/cache-mount
          cache-map: |
            {
              "uv-cache": "/root/.cache/uv"
            }

      - name: Build test image (with dev deps)
        uses: docker/build-push-action@v7
        with:
          context: ./backend/core
          file: ./backend/core/Dockerfile
          target: dev
          tags: retreev-test:${{ github.event.client_payload.short_sha }}
          load: true
          build-contexts: |
            gen=${{ github.workspace }}/backend/gen/python
            scripts=${{ github.workspace }}/backend/scripts
            tests=${{ github.workspace }}/backend/tests
          cache-from: |
            type=gha,scope=test
            type=gha,scope=core
          cache-to: type=gha,scope=test,mode=max

      - name: Run tests
        run: |
          docker run --rm \
            --entrypoint "" \
            retreev-test:${{ github.event.client_payload.short_sha }} \
            sh -c "cd /src && uv run pytest tests/ -v"
        # timeout-minutes: 10

      - name: Clean up Docker
        if: always()
        run: docker image prune -f || true

  build_core:
    if: ${{ github.event.client_payload.component == 'core' || github.event.client_payload.component == 'full' }}
    runs-on: ubuntu-24.04
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Generate Runtime Cross-Repo Token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.RETREEV_CLIENT_ID }}
          private-key: ${{ secrets.RETREEV_APP_PRIVATE_KEY }}
          owner: retreevhq
          repositories: "retreev"
          permission-actions: "read"
          permission-packages: "write"

      - name: Download backend source artifact
        run: |
          GH_TOKEN=${{ steps.app-token.outputs.token }} gh api \
            "repos/${{ github.event.client_payload.source_repo }}/actions/artifacts/${{ github.event.client_payload.artifact_id }}/zip" \
            > /tmp/artifact.zip

      - name: Extract source code
        run: |
          mkdir -p backend
          unzip -p /tmp/artifact.zip backend-src.tar.gz > /tmp/backend-src.tar.gz
          tar -xzf /tmp/backend-src.tar.gz -C backend
          rm -f /tmp/artifact.zip /tmp/backend-src.tar.gz

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        id: buildx
        with:
          buildkitd-config-inline: |
            [worker.oci]
              compression-type = "zstd"
              compression-level = 3

      - name: Logout of GitHub Container Registry
        run: docker logout ghcr.io || true

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.RETREEV_CR_PAT }}

      - name: Cache UV downloads
        uses: actions/cache@v4
        id: cache-uv
        with:
          path: backend/cache-mount
          key: uv-${{ runner.os }}-${{ hashFiles('backend/uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Restore UV cache mounts
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-dir: backend/cache-mount
          cache-map: |
            {
              "uv-cache": "/root/.cache/uv"
            }

      - name: Build and push core image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ./backend/core
          file: ./backend/core/Dockerfile
          target: cpu-base
          push: true
          provenance: false
          build-contexts: |
            gen=${{ github.workspace }}/backend/gen/python
            scripts=${{ github.workspace }}/backend/scripts
            tests=${{ github.workspace }}/backend/tests
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ github.event.client_payload.repo_name }}:${{ github.event.client_payload.env_short }}-${{ github.event.client_payload.short_sha }}
            ghcr.io/${{ github.repository_owner }}/${{ github.event.client_payload.repo_name }}:${{ github.event.client_payload.env_short }}-${{ github.event.client_payload.version }}
            ghcr.io/${{ github.repository_owner }}/${{ github.event.client_payload.repo_name }}:${{ github.event.client_payload.env_tag }}
          cache-from: type=gha,scope=core
          cache-to: type=gha,scope=core,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.event.client_payload.source_repo }}
            org.opencontainers.image.revision=${{ github.event.client_payload.short_sha }}
            org.opencontainers.image.created=${{ github.run_id }}

      - name: Clean up Docker
        if: always()
        run: docker image prune -f || true

  build_inference:
    if: ${{ github.event.client_payload.component == 'full' }}
    runs-on: ubuntu-24.04
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Generate Runtime Cross-Repo Token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.RETREEV_CLIENT_ID }}
          private-key: ${{ secrets.RETREEV_APP_PRIVATE_KEY }}
          owner: retreevhq
          repositories: "retreev"
          permission-actions: "read"
          permission-packages: "write"

      - name: Download backend source artifact
        run: |
          GH_TOKEN=${{ steps.app-token.outputs.token }} gh api \
            "repos/${{ github.event.client_payload.source_repo }}/actions/artifacts/${{ github.event.client_payload.artifact_id }}/zip" \
            > /tmp/artifact.zip

      - name: Extract source code
        run: |
          mkdir -p backend
          unzip -p /tmp/artifact.zip backend-src.tar.gz > /tmp/backend-src.tar.gz
          tar -xzf /tmp/backend-src.tar.gz -C backend
          rm -f /tmp/artifact.zip /tmp/backend-src.tar.gz

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        id: buildx
        with:
          buildkitd-config-inline: |
            [worker.oci]
              compression-type = "zstd"
              compression-level = 3

      - name: Logout of GitHub Container Registry
        run: docker logout ghcr.io || true

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.RETREEV_CR_PAT }}

      - name: Cache UV downloads
        uses: actions/cache@v4
        id: cache-uv
        with:
          path: backend/cache-mount
          key: uv-inference-${{ runner.os }}-${{ hashFiles('backend/inference/pyproject.toml', 'backend/inference/uv.lock') }}
          restore-keys: |
            uv-inference-${{ runner.os }}-

      - name: Restore UV cache mounts
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-dir: backend/cache-mount
          cache-map: |
            {
              "uv-cache": "/root/.cache/uv"
            }

      - name: Build and push inference image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ./backend/inference
          file: ./backend/inference/Dockerfile
          push: true
          provenance: false
          build-contexts: |
            gen=${{ github.workspace }}/backend/gen/python
            models=docker-image://${{ github.event.client_payload.model_bundle_ref }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ github.event.client_payload.repo_name }}-inference:${{ github.event.client_payload.env_short }}-${{ github.event.client_payload.short_sha }}
            ghcr.io/${{ github.repository_owner }}/${{ github.event.client_payload.repo_name }}-inference:${{ github.event.client_payload.env_short }}-${{ github.event.client_payload.version }}
            ghcr.io/${{ github.repository_owner }}/${{ github.event.client_payload.repo_name }}-inference:${{ github.event.client_payload.env_tag }}
          cache-from: |
            type=gha,scope=inference
          cache-to: type=gha,scope=inference,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.event.client_payload.source_repo }}
            org.opencontainers.image.revision=${{ github.event.client_payload.short_sha }}
            org.opencontainers.image.created=${{ github.run_id }}

      - name: Clean up Docker
        if: always()
        run: docker image prune -f || true

  deploy_full:
    if: ${{ github.event.client_payload.component == 'full' }}
    runs-on: ubuntu-24.04
    needs: [test, build_core, build_inference]
    environment: ${{ github.event.client_payload.env_name }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Generate Runtime Cross-Repo Token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.RETREEV_CLIENT_ID }}
          private-key: ${{ secrets.RETREEV_APP_PRIVATE_KEY }}
          owner: retreevhq
          repositories: "retreev"
          permission-actions: "read"
          permission-contents: "read"

      - name: Resolve full commit SHA
        id: full-sha
        run: |
          FULL_SHA=$(GH_TOKEN=${{ steps.app-token.outputs.token }} gh api \
            "repos/${{ github.event.client_payload.source_repo }}/commits/${{ github.event.client_payload.short_sha }}" \
            --jq .sha)
          echo "FULL_SHA=$FULL_SHA" >> "$GITHUB_OUTPUT"

      - name: Check out deployment configuration
        uses: actions/checkout@v6
        with:
          repository: ${{ github.event.client_payload.source_repo }}
          ref: ${{ steps.full-sha.outputs.FULL_SHA }}
          token: ${{ steps.app-token.outputs.token }}
          sparse-checkout: ops

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.RETREEV_CR_PAT }}

      - name: Create deployment metadata
        run: |
          cat > deployment-info.json << EOF
          {
            "deployed_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "short_sha": "${{ github.event.client_payload.short_sha }}",
            "version": "${{ github.event.client_payload.version }}",
            "environment": "${{ github.event.client_payload.env_name }}"
          }
          EOF
          cat deployment-info.json

      - name: Create env file
        run: |
          echo "CORE_TAG=${{ github.event.client_payload.env_short }}-${{ github.event.client_payload.version }}" > ./envfile
          echo "INFERENCE_TAG=${{ github.event.client_payload.env_short }}-${{ github.event.client_payload.version }}" >> ./envfile
          echo "APP_VERSION=${{ github.event.client_payload.version }}" >> ./envfile
          echo "GIT_COMMIT_SHA=${{ github.event.client_payload.short_sha }}" >> ./envfile
          echo "INFERENCE_VERSION=${{ github.event.client_payload.version }}" >> ./envfile
          echo "INFERENCE_GIT_COMMIT_SHA=${{ github.event.client_payload.short_sha }}" >> ./envfile

      # Deploy inference first so the core stack can safely prune any legacy
      # inference service left from the former combined topology.
      - name: Deploy inference stack
        uses: cssnr/stack-deploy-action@v1.5.0
        with:
          name: retreev_${{ github.event.client_payload.env_short }}_inference
          file: ops/infra/inference/stack.base.yml ops/infra/inference/stack.${{ github.event.client_payload.env_short }}.yml
          host: ${{ secrets.RETREEV_DEPLOY_HOST }}
          port: 22
          user: deploy
          ssh_key: ${{ secrets.RETREEV_DEPLOY_SSH_KEY }}
          registry_auth: true
          registry_host: ghcr.io
          registry_user: ${{ github.repository_owner }}
          registry_pass: ${{ secrets.RETREEV_CR_PAT }}
          resolve_image: changed
          prune: true
          mode: swarm
          env_file: ./envfile
          summary: true

      - name: Deploy core stack
        uses: cssnr/stack-deploy-action@v1.5.0
        with:
          name: retreev_${{ github.event.client_payload.env_short }}
          file: ops/infra/core/stack.base.yml ops/infra/core/stack.${{ github.event.client_payload.env_short }}.yml
          host: ${{ secrets.RETREEV_DEPLOY_HOST }}
          port: 22
          user: deploy
          ssh_key: ${{ secrets.RETREEV_DEPLOY_SSH_KEY }}
          registry_auth: true
          registry_host: ghcr.io
          registry_user: ${{ github.repository_owner }}
          registry_pass: ${{ secrets.RETREEV_CR_PAT }}
          resolve_image: changed
          prune: true
          mode: swarm
          env_file: ./envfile
          summary: true

  verify_core_full:
    if: ${{ github.event.client_payload.component == 'full' }}
    runs-on: ubuntu-24.04
    needs: [deploy_full]
    environment: ${{ github.event.client_payload.env_name }}

    steps:
      - name: Confirm API version and commit SHA are live
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: "${{ secrets.RETREEV_DEPLOY_HOST }}"
          port: 22
          username: deploy
          key: ${{ secrets.RETREEV_DEPLOY_SSH_KEY }}
          script: |
            EXPECTED_VERSION="${{ github.event.client_payload.version }}"
            EXPECTED_SHA="${{ github.event.client_payload.short_sha }}"
            EXPECTED_PROTOCOL="${{ github.event.client_payload.inference_protocol_version }}"

            echo "Waiting for services to be healthy..."
            for i in {1..30}; do
              REPLICAS=$(docker service ls --filter name=retreev_${{ github.event.client_payload.env_short }}_api --format "{{.Replicas}}")
              if [ -n "$REPLICAS" ] && ! echo "$REPLICAS" | grep -q "0/"; then
                RESPONSE=$(curl --fail --silent --show-error "${{ secrets.RETREEV_BASE_API_URL }}/healthcheck")
                echo "API healthcheck: $RESPONSE"

                LIVE_VERSION=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['servers']['api']['version'])" 2>/dev/null || true)
                LIVE_SHA=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['servers']['api']['commit_sha'])" 2>/dev/null || true)
                LIVE_INFERENCE_STATUS=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['servers']['inference'].get('status', ''))" 2>/dev/null || true)
                LIVE_PROTOCOL=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['servers']['inference']['protocol_version'])" 2>/dev/null || true)

                if [ "$LIVE_VERSION" = "$EXPECTED_VERSION" ] \
                  && [ "$LIVE_SHA" = "$EXPECTED_SHA" ] \
                  && [ "$LIVE_INFERENCE_STATUS" = "ok" ] \
                  && [ "$LIVE_PROTOCOL" = "$EXPECTED_PROTOCOL" ]; then
                  echo "✅ API verified: version=$LIVE_VERSION commit_sha=$LIVE_SHA inference_protocol=$LIVE_PROTOCOL"
                  exit 0
                else
                  echo "Core or inference pending: version=${LIVE_VERSION:-missing} sha=${LIVE_SHA:-missing} inference_status=${LIVE_INFERENCE_STATUS:-missing} protocol=${LIVE_PROTOCOL:-missing}"
                fi
              fi
              echo "Attempt $i/30: Services not ready yet, retrying in 5s..."
              sleep 5
            done
            echo "Timed out waiting for healthy services."
            exit 1
        timeout-minutes: 6

  verify_inference_full:
    if: ${{ github.event.client_payload.component == 'full' }}
    runs-on: ubuntu-24.04
    needs: [deploy_full, build_inference]
    environment: ${{ github.event.client_payload.env_name }}

    steps:
      - name: Confirm inference version and commit SHA are live
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: "${{ secrets.RETREEV_DEPLOY_HOST }}"
          port: 22
          username: deploy
          key: ${{ secrets.RETREEV_DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail

            SERVICE="retreev_${{ github.event.client_payload.env_short }}_inference_server"
            EXPECTED_VERSION="${{ github.event.client_payload.version }}"
            EXPECTED_SHA="${{ github.event.client_payload.short_sha }}"
            EXPECTED_PROTOCOL="${{ github.event.client_payload.inference_protocol_version }}"
            EXPECTED_DIGEST="${{ needs.build_inference.outputs.image_digest }}"
            API_HEALTHCHECK="${{ secrets.RETREEV_BASE_API_URL }}/healthcheck"

            service_env_value() {
              docker service inspect \
                --format '{{range .Spec.TaskTemplate.ContainerSpec.Env}}{{println .}}{{end}}' \
                "$SERVICE" \
                | awk -F= -v key="$1" '$1 == key {sub(/^[^=]*=/, ""); print; exit}'
            }

            echo "Waiting for the gRPC inference service and API health path..."
            for i in {1..30}; do
              REPLICAS=$(docker service ls --filter name="$SERVICE" --format "{{.Replicas}}")
              if [ -n "$REPLICAS" ] && ! echo "$REPLICAS" | grep -q "0/"; then
                IMAGE=$(docker service inspect --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}' "$SERVICE")
                LIVE_VERSION=$(service_env_value APP_VERSION)
                LIVE_SHA=$(service_env_value GIT_COMMIT_SHA)
                RESPONSE=$(curl --fail --silent --show-error "$API_HEALTHCHECK" 2>/dev/null || true)
                LIVE_STATUS=$(printf '%s' "$RESPONSE" | python3 -c "import json,sys; print(json.load(sys.stdin)['servers']['inference'].get('status', ''))" 2>/dev/null || true)
                LIVE_PROTOCOL=$(printf '%s' "$RESPONSE" | python3 -c "import json,sys; print(json.load(sys.stdin)['servers']['inference'].get('protocol_version', ''))" 2>/dev/null || true)

                if [ "$LIVE_VERSION" = "$EXPECTED_VERSION" ] \
                  && [ "$LIVE_SHA" = "$EXPECTED_SHA" ] \
                  && [ "$LIVE_STATUS" = "ok" ] \
                  && [ "$LIVE_PROTOCOL" = "$EXPECTED_PROTOCOL" ]; then
                  case "$IMAGE" in
                    *-inference:*@"$EXPECTED_DIGEST"|*-inference@"$EXPECTED_DIGEST")
                      echo "Inference verified through Core's gRPC health path: image=$IMAGE version=$LIVE_VERSION commit_sha=$LIVE_SHA protocol=$LIVE_PROTOCOL"
                      exit 0
                      ;;
                    *)
                      echo "Inference is healthy but uses unexpected image $IMAGE" >&2
                      exit 1
                      ;;
                  esac
                else
                  echo "Inference pending: replicas=$REPLICAS status=${LIVE_STATUS:-missing} version=${LIVE_VERSION:-missing} sha=${LIVE_SHA:-missing} protocol=${LIVE_PROTOCOL:-missing}"
                fi
              fi
              echo "Attempt $i/30: Services not ready yet, retrying in 5s..."
              sleep 5
            done
            echo "Timed out waiting for healthy inference services."
            exit 1
        timeout-minutes: 6

  deploy_core:
    if: ${{ github.event.client_payload.component == 'core' }}
    runs-on: ubuntu-24.04
    needs: [test, build_core]
    environment: ${{ github.event.client_payload.env_name }}

    steps:
      - name: Generate Runtime Cross-Repo Token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.RETREEV_CLIENT_ID }}
          private-key: ${{ secrets.RETREEV_APP_PRIVATE_KEY }}
          owner: retreevhq
          repositories: "retreev"
          permission-actions: "read"
          permission-contents: "read"

      - name: Resolve full commit SHA
        id: full-sha
        run: |
          FULL_SHA=$(GH_TOKEN=${{ steps.app-token.outputs.token }} gh api \
            "repos/${{ github.event.client_payload.source_repo }}/commits/${{ github.event.client_payload.short_sha }}" \
            --jq .sha)
          echo "FULL_SHA=$FULL_SHA" >> "$GITHUB_OUTPUT"

      - name: Check out deployment configuration
        uses: actions/checkout@v6
        with:
          repository: ${{ github.event.client_payload.source_repo }}
          ref: ${{ steps.full-sha.outputs.FULL_SHA }}
          token: ${{ steps.app-token.outputs.token }}
          sparse-checkout: ops

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.RETREEV_CR_PAT }}

      - name: Create deployment metadata
        run: |
          cat > deployment-info.json << EOF
          {
            "deployed_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "short_sha": "${{ github.event.client_payload.short_sha }}",
            "version": "${{ github.event.client_payload.version }}",
            "environment": "${{ github.event.client_payload.env_name }}"
          }
          EOF
          cat deployment-info.json

      - name: Create env file
        run: |
          echo "CORE_TAG=${{ github.event.client_payload.env_short }}-${{ github.event.client_payload.version }}" > ./envfile
          echo "INFERENCE_TAG=${{ github.event.client_payload.env_short }}-${{ github.event.client_payload.version }}" >> ./envfile
          echo "APP_VERSION=${{ github.event.client_payload.version }}" >> ./envfile
          echo "GIT_COMMIT_SHA=${{ github.event.client_payload.short_sha }}" >> ./envfile
          echo "INFERENCE_VERSION=${{ github.event.client_payload.version }}" >> ./envfile
          echo "INFERENCE_GIT_COMMIT_SHA=${{ github.event.client_payload.short_sha }}" >> ./envfile

      - name: Deploy core stack
        uses: cssnr/stack-deploy-action@v1.5.0
        with:
          name: retreev_${{ github.event.client_payload.env_short }}
          file: ops/infra/core/stack.base.yml ops/infra/core/stack.${{ github.event.client_payload.env_short }}.yml
          host: ${{ secrets.RETREEV_DEPLOY_HOST }}
          port: 22
          user: deploy
          ssh_key: ${{ secrets.RETREEV_DEPLOY_SSH_KEY }}
          registry_auth: true
          registry_host: ghcr.io
          registry_user: ${{ github.repository_owner }}
          registry_pass: ${{ secrets.RETREEV_CR_PAT }}
          resolve_image: changed
          prune: true
          mode: swarm
          env_file: ./envfile
          summary: true

  release_backend:
    runs-on: ubuntu-24.04
    needs: [verify_core_full, verify_inference_full]
    if: ${{ github.event.client_payload.component == 'full' && github.event.client_payload.env_name == 'production' && needs.verify_core_full.result == 'success' && needs.verify_inference_full.result == 'success' }}
    permissions:
      contents: write

    steps:
      - name: Generate Runtime Cross-Repo Token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.RETREEV_CLIENT_ID }}
          private-key: ${{ secrets.RETREEV_APP_PRIVATE_KEY }}
          owner: retreevhq
          repositories: "retreev"
          permission-contents: "write"

      - name: Checkout source code from retreev
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.client_payload.source_repo }}
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Create Release
        run: |
          TAG="backend/${{ github.event.client_payload.version }}"
          if git tag -l --format="%(contents)" "$TAG" | grep -q .; then
            # Annotated tag — use the tag message (written by OpenCode)
            gh release create "$TAG" \
              --title "Backend ${{ github.event.client_payload.version }}" \
              --notes-from-tag \
              --verify-tag \
              --latest
          else
            # Lightweight tag — auto-generate from commit history
            gh release create "$TAG" \
              --title "Backend ${{ github.event.client_payload.version }}" \
              --generate-notes \
              --verify-tag \
              --latest
          fi
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

  release_core:
    runs-on: ubuntu-24.04
    needs: [deploy_core]
    if: ${{ github.event.client_payload.component == 'core' && github.event.client_payload.env_name == 'production' && needs.deploy_core.result == 'success' }}
    permissions:
      contents: write

    steps:
      - name: Generate Runtime Cross-Repo Token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.RETREEV_CLIENT_ID }}
          private-key: ${{ secrets.RETREEV_APP_PRIVATE_KEY }}
          owner: retreevhq
          repositories: "retreev"
          permission-contents: "write"

      - name: Checkout source code from Retreev
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.client_payload.source_repo }}
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Create core release
        run: |
          TAG="core/${{ github.event.client_payload.version }}"
          if git tag -l --format="%(contents)" "$TAG" | grep -q .; then
            gh release create "$TAG" \
              --title "Core ${{ github.event.client_payload.version }}" \
              --notes-from-tag \
              --verify-tag
          else
            gh release create "$TAG" \
              --title "Core ${{ github.event.client_payload.version }}" \
              --generate-notes \
              --verify-tag
          fi
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

  notify:
    runs-on: ubuntu-24.04
    needs: [verify_core_full, verify_inference_full, deploy_full, deploy_core]
    if: always()
    environment: ${{ github.event.client_payload.env_name }}

    steps:
      - name: Determine deployment status
        id: status
        run: |
          COMPONENT="${{ github.event.client_payload.component }}"
          if [ "$COMPONENT" = "full" ] \
            && [ "${{ needs.deploy_full.result }}" = "success" ] \
            && [ "${{ needs.verify_core_full.result }}" = "success" ] \
            && [ "${{ needs.verify_inference_full.result }}" = "success" ]; then
            echo "STATUS=✅ SUCCESS" >> "$GITHUB_OUTPUT"
            echo "COLOR=good" >> "$GITHUB_OUTPUT"
          elif [ "$COMPONENT" = "core" ] \
            && [ "${{ needs.deploy_core.result }}" = "success" ]; then
            echo "STATUS=✅ SUCCESS" >> "$GITHUB_OUTPUT"
            echo "COLOR=good" >> "$GITHUB_OUTPUT"
          else
            echo "STATUS=❌ FAILED" >> "$GITHUB_OUTPUT"
            echo "COLOR=danger" >> "$GITHUB_OUTPUT"
          fi

      - name: Send Slack notification
        run: |
          curl -X POST ${{ secrets.RETREEV_SLACK_WEBHOOK_URL }} \
            -H 'Content-Type: application/json' \
            -d '{
              "text": "Retreev *${{ github.event.client_payload.component }}* deployment to ${{ github.event.client_payload.env_name }} ${{ steps.status.outputs.STATUS }}",
              "attachments": [{
                "color": "${{ steps.status.outputs.COLOR }}",
                "fields": [
                  {"title": "Component", "value": "${{ github.event.client_payload.component }}", "short": true},
                  {"title": "Environment", "value": "${{ github.event.client_payload.env_name }}", "short": true},
                  {"title": "Version", "value": "${{ github.event.client_payload.version }}", "short": true},
                  {"title": "Commit", "value": "${{ github.event.client_payload.short_sha }}", "short": true},
                  {"title": "Artifact", "value": "${{ github.event.client_payload.artifact_id }}", "short": true},
                  {"title": "Source repo", "value": "${{ github.event.client_payload.source_repo }}", "short": true},
                  {"title": "Run", "value": "https://github.com/retreevhq/runner/actions/runs/${{ github.run_id }}", "short": false}
                ]
              }]
            }'
        continue-on-error: true
