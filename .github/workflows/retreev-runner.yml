---
name: Retreev Runner

on:
  repository_dispatch:
    types:
      - "trigger-heavy-build"

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Generate Runtime Cross-Repo Token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.RETREEV_CLIENT_ID }}
          private-key: ${{ secrets.RETREEV_APP_PRIVATE_KEY }}
          owner: retreevhq
          repositories: "retreev"
          permission-actions: "read"
          permission-packages: "write"

      - name: Download backend source artifact
        run: |
          GH_TOKEN=${{ steps.app-token.outputs.token }} gh api \
            "repos/${{ github.event.client_payload.source_repo }}/actions/artifacts/${{ github.event.client_payload.artifact_id }}/zip" \
            > /tmp/artifact.zip

      - name: Extract source code
        run: |
          mkdir -p backend
          unzip -p /tmp/artifact.zip backend-src.tar.gz > /tmp/backend-src.tar.gz
          tar -xzf /tmp/backend-src.tar.gz -C backend
          rm -f /tmp/artifact.zip /tmp/backend-src.tar.gz

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        id: buildx
        with:
          buildkitd-config-inline: |
            [worker.oci]
              compression-type = "zstd"
              compression-level = 3

      - name: Logout of GitHub Container Registry
        run: docker logout ghcr.io || true

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.RETREEV_CR_PAT }}

      - name: Cache UV downloads
        uses: actions/cache@v4
        id: cache-uv
        with:
          path: backend/cache-mount
          key: uv-${{ runner.os }}-${{ hashFiles('backend/uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Restore UV cache mounts
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-dir: backend/cache-mount
          cache-map: |
            {
              "uv-cache": "/root/.cache/uv"
            }

      - name: Build test image (with dev deps)
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: dev
          tags: retreev-test:${{ github.event.client_payload.short_sha }}
          load: true
          cache-from: |
            type=gha,scope=test
            type=gha,scope=core
          cache-to: type=gha,scope=test,mode=max

      - name: Run tests
        run: |
          docker run --rm \
            --entrypoint "" \
            retreev-test:${{ github.event.client_payload.short_sha }} \
            sh -c "cd /src && uv run pytest tests/ -v"
        timeout-minutes: 10

      - name: Clean up Docker
        if: always()
        run: docker image prune -f || true

  build_core:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Generate Runtime Cross-Repo Token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.RETREEV_CLIENT_ID }}
          private-key: ${{ secrets.RETREEV_APP_PRIVATE_KEY }}
          owner: retreevhq
          repositories: "retreev"
          permission-actions: "read"
          permission-packages: "write"

      - name: Download backend source artifact
        run: |
          GH_TOKEN=${{ steps.app-token.outputs.token }} gh api \
            "repos/${{ github.event.client_payload.source_repo }}/actions/artifacts/${{ github.event.client_payload.artifact_id }}/zip" \
            > /tmp/artifact.zip

      - name: Extract source code
        run: |
          mkdir -p backend
          unzip -p /tmp/artifact.zip backend-src.tar.gz > /tmp/backend-src.tar.gz
          tar -xzf /tmp/backend-src.tar.gz -C backend
          rm -f /tmp/artifact.zip /tmp/backend-src.tar.gz

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        id: buildx
        with:
          buildkitd-config-inline: |
            [worker.oci]
              compression-type = "zstd"
              compression-level = 3

      - name: Logout of GitHub Container Registry
        run: docker logout ghcr.io || true

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.RETREEV_CR_PAT }}

      - name: Cache UV downloads
        uses: actions/cache@v4
        id: cache-uv
        with:
          path: backend/cache-mount
          key: uv-${{ runner.os }}-${{ hashFiles('backend/uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Restore UV cache mounts
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-dir: backend/cache-mount
          cache-map: |
            {
              "uv-cache": "/root/.cache/uv"
            }

      - name: Build and push core image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: cpu-base
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ github.event.client_payload.repo_owner }}/${{ github.event.client_payload.repo_name }}:${{ github.event.client_payload.env_short }}-${{ github.event.client_payload.short_sha }}
            ghcr.io/${{ github.event.client_payload.repo_owner }}/${{ github.event.client_payload.repo_name }}:${{ github.event.client_payload.env_short }}-${{ github.event.client_payload.version }}
            ghcr.io/${{ github.event.client_payload.repo_owner }}/${{ github.event.client_payload.repo_name }}:${{ github.event.client_payload.env_tag }}
          cache-from: type=gha,scope=core
          cache-to: type=gha,scope=core,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.event.client_payload.source_repo }}
            org.opencontainers.image.revision=${{ github.event.client_payload.short_sha }}
            org.opencontainers.image.created=${{ github.event.client_payload.run_id }}

      - name: Clean up Docker
        if: always()
        run: docker image prune -f || true

  build_inference:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Generate Runtime Cross-Repo Token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.RETREEV_CLIENT_ID }}
          private-key: ${{ secrets.RETREEV_APP_PRIVATE_KEY }}
          owner: retreevhq
          repositories: "retreev"
          permission-actions: "read"
          permission-packages: "write"

      - name: Download backend source artifact
        run: |
          GH_TOKEN=${{ steps.app-token.outputs.token }} gh api \
            "repos/${{ github.event.client_payload.source_repo }}/actions/artifacts/${{ github.event.client_payload.artifact_id }}/zip" \
            > /tmp/artifact.zip

      - name: Extract source code
        run: |
          mkdir -p backend
          unzip -p /tmp/artifact.zip backend-src.tar.gz > /tmp/backend-src.tar.gz
          tar -xzf /tmp/backend-src.tar.gz -C backend
          rm -f /tmp/artifact.zip /tmp/backend-src.tar.gz

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        id: buildx
        with:
          buildkitd-config-inline: |
            [worker.oci]
              compression-type = "zstd"
              compression-level = 3

      - name: Logout of GitHub Container Registry
        run: docker logout ghcr.io || true

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.RETREEV_CR_PAT }}

      - name: Cache UV downloads
        uses: actions/cache@v4
        id: cache-uv
        with:
          path: backend/cache-mount
          key: uv-${{ runner.os }}-${{ hashFiles('backend/uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Restore UV cache mounts
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-dir: backend/cache-mount
          cache-map: |
            {
              "uv-cache": "/root/.cache/uv"
            }

      - name: Build and push inference image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: inference
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ github.event.client_payload.repo_owner }}/${{ github.event.client_payload.repo_name }}-inference:${{ github.event.client_payload.env_short }}-${{ github.event.client_payload.short_sha }}
            ghcr.io/${{ github.event.client_payload.repo_owner }}/${{ github.event.client_payload.repo_name }}-inference:${{ github.event.client_payload.env_short }}-${{ github.event.client_payload.version }}
            ghcr.io/${{ github.event.client_payload.repo_owner }}/${{ github.event.client_payload.repo_name }}-inference:${{ github.event.client_payload.env_tag }}
          cache-from: |
            type=gha,scope=inference
            type=gha,scope=core
          cache-to: type=gha,scope=inference,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.event.client_payload.source_repo }}
            org.opencontainers.image.revision=${{ github.event.client_payload.short_sha }}
            org.opencontainers.image.created=${{ github.event.client_payload.run_id }}

      - name: Clean up Docker
        if: always()
        run: docker image prune -f || true

  deploy:
    runs-on: ubuntu-24.04
    needs: [test, build_core, build_inference]
    environment: ${{ github.event.client_payload.env_name }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Generate Runtime Cross-Repo Token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.RETREEV_CLIENT_ID }}
          private-key: ${{ secrets.RETREEV_APP_PRIVATE_KEY }}
          owner: retreevhq
          repositories: "retreev"
          permission-actions: "read"

      - name: Download backend source artifact
        run: |
          GH_TOKEN=${{ steps.app-token.outputs.token }} gh api \
            "repos/${{ github.event.client_payload.source_repo }}/actions/artifacts/${{ github.event.client_payload.artifact_id }}/zip" \
            > /tmp/artifact.zip

      - name: Extract source code
        run: |
          mkdir -p backend
          unzip -p /tmp/artifact.zip backend-src.tar.gz > /tmp/backend-src.tar.gz
          tar -xzf /tmp/backend-src.tar.gz -C backend
          rm -f /tmp/artifact.zip /tmp/backend-src.tar.gz

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.RETREEV_CR_PAT }}

      - name: Create deployment metadata
        run: |
          cat > deployment-info.json << EOF
          {
            "deployed_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "short_sha": "${{ github.event.client_payload.short_sha }}",
            "version": "${{ github.event.client_payload.version }}",
            "environment": "${{ github.event.client_payload.env_name }}"
          }
          EOF
          cat deployment-info.json

      - name: Create env file
        run: |
          echo "CORE_TAG=${{ github.event.client_payload.env_short }}-${{ github.event.client_payload.version }}" > ./envfile
          echo "INFERENCE_TAG=${{ github.event.client_payload.env_short }}-${{ github.event.client_payload.version }}" >> ./envfile
          echo "APP_VERSION=${{ github.event.client_payload.version }}" >> ./envfile
          echo "GIT_COMMIT_SHA=${{ github.event.client_payload.short_sha }}" >> ./envfile

      - name: Deploy
        uses: cssnr/stack-deploy-action@v1.5.0
        with:
          name: retreev_${{ github.event.client_payload.env_short }}
          file: backend/infra/stack.base.yml backend/infra/stack.${{ github.event.client_payload.env_short }}.yml
          host: ${{ secrets.DEPLOY_HOST }}
          port: 22
          user: deploy
          ssh_key: ${{ secrets.DEPLOY_SSH_KEY }}
          registry_auth: true
          registry_host: ghcr.io
          registry_user: ${{ github.event.client_payload.repo_owner }}
          registry_pass: ${{ secrets.RETREEV_CR_PAT }}
          resolve_image: changed
          prune: true
          mode: swarm
          env_file: ./envfile
          summary: true

  verify_core:
    runs-on: ubuntu-24.04
    needs: [deploy]
    environment: ${{ github.event.client_payload.env_name }}

    steps:
      - name: Confirm API version and commit SHA are live
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: "${{ secrets.DEPLOY_HOST }}"
          port: 22
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            EXPECTED_VERSION="${{ github.event.client_payload.version }}"
            EXPECTED_SHA="${{ github.event.client_payload.short_sha }}"

            echo "Waiting for services to be healthy..."
            for i in {1..30}; do
              REPLICAS=$(docker service ls --filter name=retreev_${{ github.event.client_payload.env_short }} --format "{{.Replicas}}")
              if [ -n "$REPLICAS" ] && ! echo "$REPLICAS" | grep -q "0/"; then
                RESPONSE=$(curl -s "${{ secrets.BASE_API_URL }}/healthcheck")
                echo "API healthcheck: $RESPONSE"

                LIVE_VERSION=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['servers']['api']['version'])" 2>/dev/null || true)
                LIVE_SHA=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['servers']['api']['commit_sha'])" 2>/dev/null || true)

                if [ "$LIVE_VERSION" = "$EXPECTED_VERSION" ] && [ "$LIVE_SHA" = "$EXPECTED_SHA" ]; then
                  echo "✅ API verified: version=$LIVE_VERSION commit_sha=$LIVE_SHA"
                  exit 0
                else
                  echo "❌ Version mismatch (got version=$LIVE_VERSION sha=$LIVE_SHA, expected version=$EXPECTED_VERSION sha=$EXPECTED_SHA)"
                  exit 1
                fi
              fi
              echo "Attempt $i/30: Services not ready yet, retrying in 5s..."
              sleep 5
            done
            echo "Timed out waiting for healthy services."
            exit 1
        timeout-minutes: 6

  verify_inference:
    runs-on: ubuntu-24.04
    needs: [deploy]
    environment: ${{ github.event.client_payload.env_name }}

    steps:
      - name: Confirm inference version and commit SHA are live
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: "${{ secrets.DEPLOY_HOST }}"
          port: 22
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            EXPECTED_VERSION="${{ github.event.client_payload.version }}"
            EXPECTED_SHA="${{ github.event.client_payload.short_sha }}"

            echo "Waiting for inference service to be healthy..."
            for i in {1..30}; do
              REPLICAS=$(docker service ls --filter name=retreev_${{ github.event.client_payload.env_short }} --format "{{.Replicas}}")
              if [ -n "$REPLICAS" ] && ! echo "$REPLICAS" | grep -q "0/"; then
                RESPONSE=$(curl -s "${{ secrets.INFERENCE_API_URL }}/healthcheck")
                echo "Inference healthcheck: $RESPONSE"

                LIVE_VERSION=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['version'])" 2>/dev/null || true)
                LIVE_SHA=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['commit_sha'])" 2>/dev/null || true)

                if [ "$LIVE_VERSION" = "$EXPECTED_VERSION" ] && [ "$LIVE_SHA" = "$EXPECTED_SHA" ]; then
                  echo "✅ Inference verified: version=$LIVE_VERSION commit_sha=$LIVE_SHA"
                  exit 0
                else
                  echo "❌ Version mismatch (got version=$LIVE_VERSION sha=$LIVE_SHA, expected version=$EXPECTED_VERSION sha=$EXPECTED_SHA)"
                  exit 1
                fi
              fi
              echo "Attempt $i/30: Services not ready yet, retrying in 5s..."
              sleep 5
            done
            echo "Timed out waiting for healthy inference services."
            exit 1
        timeout-minutes: 6

  release:
    runs-on: ubuntu-24.04
    needs: [verify_core, verify_inference]
    if: always() && needs.verify_core.result == 'success' && needs.verify_inference.result == 'success'
    permissions:
      contents: write

    steps:
      - name: Generate Runtime Cross-Repo Token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.RETREEV_CLIENT_ID }}
          private-key: ${{ secrets.RETREEV_APP_PRIVATE_KEY }}
          owner: retreevhq
          repositories: "retreev"
          permission-contents: "write"

      - name: Checkout source code from retreev
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.client_payload.source_repo }}
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Create Release
        run: |
          gh release create "backend/${{ github.event.client_payload.version }}" \
            --repo "${{ github.event.client_payload.source_repo }}" \
            --title "Backend ${{ github.event.client_payload.version }}" \
            --notes "## Backend ${{ github.event.client_payload.version }}

          **Environment**: ${{ github.event.client_payload.env_name }}
          **Commit**: ${{ github.event.client_payload.short_sha }}" \
            --latest
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

  notify:
    runs-on: ubuntu-24.04
    needs: [verify_core, verify_inference]
    if: always()
    environment: ${{ github.event.client_payload.env_name }}

    steps:
      - name: Determine deployment status
        id: status
        run: |
          if [ "${{ needs.verify_core.result }}" == "success" ] && [ "${{ needs.verify_inference.result }}" == "success" ]; then
            echo "STATUS=✅ SUCCESS" >> "$GITHUB_OUTPUT"
            echo "COLOR=good" >> "$GITHUB_OUTPUT"
          else
            echo "STATUS=❌ FAILED" >> "$GITHUB_OUTPUT"
            echo "COLOR=danger" >> "$GITHUB_OUTPUT"
          fi

      - name: Send Slack notification
        run: |
          curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
            -H 'Content-Type: application/json' \
            -d '{
              "text": "Retreev ${{ github.event.client_payload.env_name }} Deployment ${{ steps.status.outputs.STATUS }}",
              "attachments": [{
                "color": "${{ steps.status.outputs.COLOR }}",
                "fields": [
                  {"title": "Version", "value": "${{ github.event.client_payload.version }}", "short": true},
                  {"title": "Commit", "value": "${{ github.event.client_payload.short_sha }}", "short": true}
                ]
              }]
            }'
        continue-on-error: true
